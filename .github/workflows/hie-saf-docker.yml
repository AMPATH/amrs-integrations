name: hie-saf docker image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    paths:
      - "packages/hie-saf/**"
      - ".github/workflows/hie-saf-docker.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Optional extra image tag, e.g. 4.7 (published as v4.7)"
        required: false
        type: string

env:
  IMAGE: ampathke/hie-saf-integration

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=tag
            type=raw,value=v${{ inputs.version }},enable=${{ inputs.version != '' }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: packages/hie-saf
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
